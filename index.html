<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>県央進路 実習情報共有</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #f5f6f8; color: #333; }
  header { background: #2f5d8a; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; flex: 1; }
  header button { background: #fff; color: #2f5d8a; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
  #status { padding: 6px 16px; font-size: 12px; color: #666; }
  #status.error { color: #c0392b; }
  nav { display: flex; gap: 4px; padding: 8px 16px 0; flex-wrap: wrap; }
  nav button { border: 1px solid #ccc; border-bottom: none; background: #e8eaee; padding: 7px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; }
  nav button.active { background: #fff; font-weight: bold; border-color: #aaa; }
  #panel { background: #fff; margin: 0 16px 16px; border: 1px solid #ddd; border-radius: 0 8px 8px 8px; padding: 12px; }
  #search { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
  #search input, #search select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  #search .clear { background: #eee; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .switch button { border: 1px solid #ccc; background: #f0f1f4; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .switch button:first-child { border-radius: 6px 0 0 6px; }
  .switch button:last-child { border-radius: 0 6px 6px 0; }
  .switch button.active { background: #2f5d8a; color: #fff; border-color: #2f5d8a; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: left; }
  th { background: #f0f3f7; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 11px; white-space: nowrap; }
  #calHead { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
  #calHead h2 { font-size: 16px; }
  #calHead button { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dow { text-align: center; font-size: 12px; font-weight: bold; padding: 4px 0; background: #f0f3f7; }
  .cell { background: #fff; border: 1px solid #e8e8e8; min-height: 84px; padding: 2px; font-size: 11px; }
  .cell .d { font-size: 11px; color: #888; }
  .cell.today { outline: 2px solid #2f5d8a; }
  .cell.other { background: #fafafa; color: #bbb; }
  .chip { display: block; color: #fff; border-radius: 4px; padding: 1px 4px; margin-top: 2px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .more { color: #2f5d8a; margin-top: 2px; cursor: default; }
  #legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; }
  #legend span { display: flex; align-items: center; gap: 4px; }
  #legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); align-items: center; justify-content: center; }
  #modal { background: #fff; border-radius: 10px; padding: 20px; width: min(420px, 90vw); }
  #modal h3 { margin-bottom: 10px; font-size: 15px; }
  #modal dl { font-size: 13px; }
  #modal dt { font-weight: bold; color: #666; margin-top: 8px; }
  #modal .close { margin-top: 14px; background: #2f5d8a; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; cursor: pointer; }
  .empty { padding: 20px; text-align: center; color: #999; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>🗓️ 県央進路 実習情報共有</h1>
  <div class="switch">
    <button id="btnList" class="active">📋 一覧</button>
    <button id="btnCal">📅 カレンダー</button>
  </div>
  <button id="btnReload">🔄 再読み込み</button>
</header>
<div id="status">読み込み中…</div>
<nav id="tabs"></nav>
<div id="panel">
  <div id="search">
    🔍
    <input id="fKeyword" placeholder="キーワード（学年・生徒・事業所・備考）" size="26">
    <select id="fType"><option value="">種別：すべて</option></select>
    <label>期間 <input type="date" id="fFrom"></label>〜<input type="date" id="fTo">
    <button class="clear" id="fClear">条件クリア</button>
  </div>
  <div id="listView"></div>
  <div id="calView" style="display:none">
    <div id="calHead">
      <button id="calPrev">◀</button>
      <h2 id="calTitle"></h2>
      <button id="calNext">▶</button>
      <button id="calToday">今日</button>
    </div>
    <div id="calGrid"></div>
    <div id="legend"></div>
  </div>
</div>
<div id="overlay"><div id="modal"></div></div>
<script>
/* ================= 設定 =================
   各シートを「ファイル → 共有 → ウェブに公開」で
   CSV形式で公開し、そのURLを貼り付けてください。
   ・集約シート1枚の場合: school は "" のまま（学校列を使用）
   ・各校シートの場合: school に学校名を記入して7行登録
*/
const SHEET_SOURCES = [
  { school: "", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRwDXh70_OoAD3_v_Rxqg9uRopiOy8AHCbWD2lK8uVRJFxpjUoTzU-KWqnPLQmlnbgfu-2oKFHKkgOy/pub?gid=1537411534&single=true&output=csv" },
  // { school: "秋田きらり支援学校", url: "https://docs.google.com/.../pub?output=csv" },
];
/* ======================================== */

const PALETTE = ["#4f86c6","#5cb85c","#e6a23c","#e67c73","#8e7cc3","#d96fa6","#8d6e63","#46a5a0"];
let records = [], schools = [], active = "すべて";
let cal = new Date(); cal.setDate(1);

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ""; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function parseDate(s) {
  if (!s) return null;
  s = String(s).trim().replace(/[年月]/g, "/").replace(/日/g, "");
  let m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if (m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  const d = new Date(s);
  return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function toRecords(rows, schoolName) {
  if (rows.length < 2) return [];
  let hi = rows.findIndex(r => r.some(c => String(c).includes("開始")));
  if (hi < 0 || hi >= rows.length - 1) hi = 0;
  const head = rows[hi].map(h => String(h).trim());
  const idx = kws => head.findIndex(h => kws.some(k => h.includes(k)));
  const iSchool = idx(["学校"]), iGrade = idx(["学年"]), iName = idx(["生徒","実習名","名前","氏名"]),
        iOffice = idx(["事業所","実習先","企業"]), iType = idx(["種別"]),
        iStart = idx(["開始"]), iEnd = idx(["終了"]),
        iStaff = idx(["担当","巡回"]), iNote = idx(["備考"]);
  return rows.slice(hi + 1)
    .filter(r => r.some(c => String(c).trim() !== ""))
    .map(r => {
      const g = i => (i >= 0 && r[i] != null) ? String(r[i]).trim() : "";
      const start = parseDate(g(iStart));
      return {
        school: schoolName || g(iSchool) || "（学校名なし）",
        grade: g(iGrade), name: g(iName), office: g(iOffice), type: g(iType),
        start, end: parseDate(g(iEnd)) || start,
        staff: g(iStaff), note: g(iNote)
      };
    })
    .filter(r => r.name || r.office || r.start);
}

async function loadData() {
  const st = document.getElementById("status");
  st.className = ""; st.textContent = "読み込み中…";
  records = []; const errs = [];
  for (const src of SHEET_SOURCES) {
    if (!src.url || !src.url.startsWith("http")) { errs.push("URL未設定の行があります"); continue; }
    const tries = [src.url];
    if (src.url.includes("/pub?") && !src.url.includes("single=true")) {
      tries.push(src.url + "&single=true&gid=0");
    }
    let ok = false, lastErr = null;
    for (const u of tries) {
      try {
        const res = await fetch(u, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        records.push(...toRecords(parseCSV(await res.text()), src.school));
        ok = true; break;
      } catch (e) { lastErr = e; }
    }
    if (!ok) {
      let msg = lastErr && lastErr.message ? lastErr.message : String(lastErr);
      if (/fetch/i.test(msg)) msg += "（ブラウザやネットワークが通信を遮断している可能性。別のブラウザ・別の回線でお試しください）";
      errs.push((src.school || "シート") + " の読み込みに失敗：" + msg);
    }
  }
  records.sort((a, b) => (a.start || 0) - (b.start || 0));
  schools = [...new Set(records.map(r => r.school))];
  if (errs.length) { st.className = "error"; st.textContent = "⚠️ " + errs.join(" ／ "); }
  else st.textContent = records.length + " 件読み込みました（" + new Date().toLocaleTimeString() + "）";
  buildTabs(); buildTypeOptions(); render();
}

function schoolColor(s) { return PALETTE[Math.max(0, schools.indexOf(s)) % PALETTE.length]; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(d) { return d ? d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() : ""; }

function buildTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  ["すべて", ...schools].forEach(s => {
    const b = document.createElement("button");
    b.textContent = s; b.className = s === active ? "active" : "";
    b.onclick = () => { active = s; buildTabs(); render(); };
    nav.appendChild(b);
  });
}

function buildTypeOptions() {
  const sel = document.getElementById("fType");
  const cur = sel.value;
  sel.innerHTML = '<option value="">種別：すべて</option>';
  [...new Set(records.map(r => r.type).filter(Boolean))].forEach(t => {
    const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  sel.value = cur;
}

function filtered() {
  const kw = document.getElementById("fKeyword").value.trim();
  const ty = document.getElementById("fType").value;
  const from = document.getElementById("fFrom").value ? new Date(document.getElementById("fFrom").value) : null;
  const to = document.getElementById("fTo").value ? new Date(document.getElementById("fTo").value) : null;
  return records.filter(r => {
    if (active !== "すべて" && r.school !== active) return false;
    if (kw && ![r.name, r.office, r.note, r.staff, r.grade].join(" ").includes(kw)) return false;
    if (ty && r.type !== ty) return false;
    if (from && (!r.end || r.end < from)) return false;
    if (to && (!r.start || r.start > to)) return false;
    return true;
  });
}

function render() { renderList(); renderCal(); }

function renderList() {
  const list = filtered();
  const el = document.getElementById("listView");
  if (!list.length) { el.innerHTML = '<div class="empty">該当する実習がありません</div>'; return; }
  el.innerHTML = "<table><tr><th>学校</th><th>対象学年</th><th>生徒</th><th>事業所</th><th>種別</th><th>期間</th><th>巡回担当</th><th>備考</th></tr>" +
    list.map(r =>
      "<tr><td><span class='badge' style='background:" + schoolColor(r.school) + "'>" + esc(r.school) + "</span></td>" +
      "<td>" + esc(r.grade) + "</td><td>" + esc(r.name) + "</td><td>" + esc(r.office) + "</td><td>" + esc(r.type) + "</td>" +
      "<td>" + fmt(r.start) + (r.end && r.end > r.start ? "〜" + fmt(r.end) : "") + "</td>" +
      "<td>" + esc(r.staff) + "</td><td>" + esc(r.note) + "</td></tr>"
    ).join("") + "</table>";
}

function renderCal() {
  const list = filtered().filter(r => r.start);
  const y = cal.getFullYear(), mo = cal.getMonth();
  document.getElementById("calTitle").textContent = y + "年 " + (mo + 1) + "月";
  const grid = document.getElementById("calGrid");
  grid.innerHTML = ["日","月","火","水","木","金","土"].map(d => "<div class='dow'>" + d + "</div>").join("");
  const first = new Date(y, mo, 1), startDow = first.getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < startDow; i++) grid.innerHTML += "<div class='cell other'></div>";
  for (let d = 1; d <= days; d++) {
    const day = new Date(y, mo, d);
    const evs = list.filter(r => r.start <= day && day <= (r.end || r.start));
    let html = "<div class='d'>" + d + "</div>";
    evs.slice(0, 3).forEach(r => {
      html += "<span class='chip' style='background:" + schoolColor(r.school) + "' data-i='" + records.indexOf(r) + "'>" + esc(r.office || r.name) + "</span>";
    });
    if (evs.length > 3) html += "<div class='more'>＋" + (evs.length - 3) + "件</div>";
    grid.innerHTML += "<div class='cell" + (day.getTime() === today.getTime() ? " today" : "") + "'>" + html + "</div>";
  }
  grid.querySelectorAll(".chip").forEach(c => c.onclick = () => showDetail(records[+c.dataset.i]));
  document.getElementById("legend").innerHTML = schools.map(s =>
    "<span><i style='background:" + schoolColor(s) + "'></i>" + esc(s) + "</span>").join("");
}

function showDetail(r) {
  if (!r) return;
  document.getElementById("modal").innerHTML =
    "<h3>" + esc(r.office || r.name) + "</h3><dl>" +
    "<dt>学校</dt><dd>" + esc(r.school) + "</dd>" +
    "<dt>対象学年</dt><dd>" + esc(r.grade || "−") + "</dd>" +
    "<dt>生徒</dt><dd>" + esc(r.name || "−") + "</dd>" +
    "<dt>種別</dt><dd>" + esc(r.type || "−") + "</dd>" +
    "<dt>期間</dt><dd>" + fmt(r.start) + (r.end && r.end > r.start ? "〜" + fmt(r.end) : "") + "</dd>" +
    "<dt>巡回担当</dt><dd>" + esc(r.staff || "−") + "</dd>" +
    "<dt>備考</dt><dd>" + esc(r.note || "−") + "</dd></dl>" +
    "<button class='close' onclick='document.getElementById(\"overlay\").style.display=\"none\"'>閉じる</button>";
  document.getElementById("overlay").style.display = "flex";
}

document.getElementById("btnReload").onclick = loadData;
document.getElementById("btnList").onclick = () => switchView("list");
document.getElementById("btnCal").onclick = () => switchView("cal");
function switchView(v) {
  document.getElementById("btnList").className = v === "list" ? "active" : "";
  document.getElementById("btnCal").className = v === "cal" ? "active" : "";
  document.getElementById("listView").style.display = v === "list" ? "" : "none";
  document.getElementById("calView").style.display = v === "cal" ? "" : "none";
}
document.getElementById("calPrev").onclick = () => { cal.setMonth(cal.getMonth() - 1); renderCal(); };
document.getElementById("calNext").onclick = () => { cal.setMonth(cal.getMonth() + 1); renderCal(); };
document.getElementById("calToday").onclick = () => { cal = new Date(); cal.setDate(1); renderCal(); };
["fKeyword","fType","fFrom","fTo"].forEach(id => document.getElementById(id).addEventListener("input", render));
document.getElementById("fClear").onclick = () => {
  ["fKeyword","fFrom","fTo"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("fType").value = ""; render();
};
document.getElementById("overlay").onclick = e => { if (e.target.id === "overlay") e.target.style.display = "none"; };

loadData();
</script>
</body>
</html>
